[nats_kv_checkpointer_lookup]
collection = nats_kv_checkpointer
external_type = kvstore
fields_list = _key, state

# See props.conf [source::nats_subscribe://...]
[nats_subject_from_source]
INGEST_EVAL = nats_subject=if(match(source, "^nats_(subscribe|kv)://[^ ]+ [^ ]+$"), replace(source, "^.* ", ""), null()), source:=replace(source, "^(nats_(subscribe|kv)://[^ ]+) [^ ]+$", "\1")
