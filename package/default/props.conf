# Each NATS message (or KV entry) is one event, and the inputs set _time
# themselves: the receive time for subscribe messages and the entry's created
# time for KV entries. DATETIME_CONFIG = NONE keeps that time instead of letting
# Splunk guess a timestamp from the payload. TRUNCATE allows the default NATS
# max_payload (1 MiB) even after base64 encoding of binary payloads.

# Raw message payloads: the nats_subscribe input and natssubscribe default.
[nats:message]
SHOULD_LINE_MERGE = false
LINE_BREAKER = ((?!))
TRUNCATE = 2097152
DATETIME_CONFIG = NONE
CHARSET = UTF-8

# JSON message payloads.
[nats:json]
SHOULD_LINE_MERGE = false
LINE_BREAKER = ((?!))
TRUNCATE = 2097152
DATETIME_CONFIG = NONE
CHARSET = UTF-8
KV_MODE = json

# JetStream KV entries: the nats_kv input and natskv default.
[nats:kv]
SHOULD_LINE_MERGE = false
LINE_BREAKER = ((?!))
TRUNCATE = 2097152
DATETIME_CONFIG = NONE
CHARSET = UTF-8
KV_MODE = json

# Inputs write each event with the source "<input name> <NATS subject>" (NATS
# subjects never contain spaces). At index time the subject moves into the
# indexed field nats_subject and the source becomes the input name, e.g.
# nats_subscribe://telemetry, which is what the Monitoring Dashboard matches
# license usage to inputs by. These stanzas apply whatever the sourcetype.
[source::nats_subscribe://...]
TRANSFORMS-nats_subject = nats_subject_from_source

[source::nats_kv://...]
TRANSFORMS-nats_subject = nats_subject_from_source
# KV entry subjects are $KV.<bucket>.<key>
EVAL-nats_kv_bucket = replace(nats_subject, "^\$KV\.([^.]+)\..*$", "\1")
EVAL-nats_kv_key = replace(nats_subject, "^\$KV\.[^.]+\.", "")
